name: Render README cards
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST, daily
  workflow_dispatch:
  push:
    paths: ["scripts/**", "fonts/**", ".github/workflows/cards.yml"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contributions + repos
        run: ./scripts/fetch_data.sh "${{ github.repository_owner }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python3 scripts/render_readme_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cards data README.md
          git diff --cached --quiet || git commit -m "Redraw README cards" && git push
